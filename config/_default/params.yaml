# Admin
admin:

  cms: sveltiacms
  name: github
  repo: Hugolify/hugolify-demo-sveltiacms
  skip_ci: true
  locale: en # CMS interface language
  auth:
    netlify_identity: false

  collections:
    indexes:
      enable: false # disable unused collection
  collection_groups:
    - collections: [pages, projects, projects_types]
    - collections: [posts, posts_categories, posts_tags]
    - collections: [persons, menus, config]